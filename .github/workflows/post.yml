name: WealthWave FM weekly scheduler

on:
  schedule:
    # Once a week, Sunday morning. It queues the following 7 days into
    # Upload-Post, which then publishes each post at the exact time.
    - cron: "17 9 * * 0"
  workflow_dispatch:
    inputs:
      test:
        description: "Test run? (queues ONE private post 15 minutes from now)"
        type: choice
        options: ["true", "false"]
        default: "true"
      only:
        description: "Only redo one stream? (leave blank for all, or type neurofusion / meaffirmation)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: wealthwave-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install pillow requests imageio-ffmpeg

      - name: Get fonts
        run: |
          mkdir -p fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sSfL -o fonts/Poppins-Bold.ttf         "$base/poppins/Poppins-Bold.ttf"
          curl -sSfL -o fonts/Poppins-Medium.ttf       "$base/poppins/Poppins-Medium.ttf"
          curl -sSfL -o fonts/Lora-Variable.ttf        "$base/lora/Lora%5Bwght%5D.ttf"
          curl -sSfL -o fonts/Lora-Italic-Variable.ttf "$base/lora/Lora-Italic%5Bwght%5D.ttf"

      - name: Queue the week
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test || 'false' }}
          ONLY_STREAM: ${{ inputs.only || '' }}
        run: python schedule_week.py

      - name: Remember what was queued
        if: always()
        run: |
          git config user.name "wealthwave-agent"
          git config user.email "agent@users.noreply.github.com"
          git add bank*.json
          ls state*.json >/dev/null 2>&1 && git add state*.json
          git diff --cached --quiet || git commit -m "Queued a week of posts"
          git pull --rebase
          git push
